[package]
name = "ferrite"
version = "0.1.0"
edition = "2024"
description = "A from-scratch CPU inference engine for Qwen3.5 / Qwen3.8-architecture language models"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
half = "2"
unicode-normalization = "0.1"
unicode-general-category = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
anyhow = "1"
faer = "0.24.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[profile.dev]
opt-level = 2

[workspace]
members = [".", "app"]
resolver = "3"
