# Build for the exact CPU we run on (Tiger Lake: AVX-512 + VNNI). The hot kernels
# also do runtime feature detection, so the code stays portable if this is removed.
#
# raw-dylib import libraries (windows-sys, pulled in by the GUI crates) need a
# 64-bit dlltool whose own directory also holds a 64-bit `as.exe`; the old 32-bit
# MinGW in C:\MinGW\bin on PATH would otherwise shadow both. WinLibs MinGW-w64
# (`winget install BrechtSanders.WinLibs.POSIX.UCRT`) provides them.
[target.x86_64-pc-windows-gnu]
rustflags = [
    "-C", "target-cpu=native",
    "-C", "dlltool=C:/Users/<user>/AppData/Local/Microsoft/WinGet/Packages/BrechtSanders.WinLibs.POSIX.UCRT_Microsoft.Winget.Source_8wekyb3d8bbwe/mingw64/bin/dlltool.exe",
]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=native"]
