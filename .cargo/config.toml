# Build for the CPU we run on, so rustc can use AVX-512 everywhere. The hot
# kernels also detect CPU features at runtime, so the code stays portable if
# this is removed (e.g. to build a binary for another machine).
#
# windows-gnu: the desktop app pulls in raw-dylib import libraries
# (windows-sys), which need a 64-bit `dlltool` with a 64-bit `as.exe` next to
# it. rustc finds `dlltool` on PATH; WinLibs MinGW-w64
# (`winget install BrechtSanders.WinLibs.POSIX.UCRT`) provides both, and
# chat.cmd puts it first on PATH. See docs/development.md.
[target.x86_64-pc-windows-gnu]
rustflags = [
    "-C", "target-cpu=native",
    # always link with rustup's bundled MinGW pieces, whatever gcc is on PATH
    "-C", "link-self-contained=yes",
]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]
