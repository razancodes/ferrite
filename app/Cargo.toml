[package]
name = "ferrite-app"
version = "0.2.0"
edition = "2024"
description = "ferrite chat: desktop app (Tauri) for the ferrite CPU inference engine"
license = "MIT"
repository = "https://github.com/razancodes/ferrite"

[[bin]]
name = "ferrite-chat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ferrite = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tauri-plugin-opener = "2"
